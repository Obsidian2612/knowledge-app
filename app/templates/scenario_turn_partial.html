<div class="entry-card">
  <p class="entry-question">Q: {{ turn.question }}</p>
  <p>{{ turn.answer }}</p>
</div>

<div id="case-interview" hx-swap-oob="true">
  {% if scenario.status == "open" %}
    {% if scenario.current_question %}
    <div class="question-box">
      <p class="question">{{ scenario.current_question }}</p>
      <form hx-post="/case/{{ scenario.id }}/turn"
            hx-target="#timeline"
            hx-swap="beforeend"
            hx-encoding="multipart/form-data"
            hx-on::after-request="this.reset()">
        <textarea name="answer" rows="5" required placeholder="Type your answer..."></textarea>
        <label class="file-label">Attach photos (optional)
          <input type="file" name="images" accept="image/*" multiple>
        </label>
        <button type="submit">Continue</button>
      </form>
    </div>
    {% else %}
    <p class="muted">The AI thinks this case is fully documented — finish it up whenever you're ready.</p>
    {% endif %}
    <form method="post" action="/case/{{ scenario.id }}/finish">
      <button type="submit" class="finish-btn">Finish &amp; write up case</button>
    </form>
  {% endif %}
</div>
