services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://knowledge:knowledge@db:5432/knowledge
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    ports:
      - "8009:8000"
    volumes:
      - uploads:/app/data/uploads
    networks:
      - default
      - ollama-net

volumes:
  pgdata:
  uploads:

networks:
  default:
  ollama-net:
    external: true
    name: CHANGE_ME_TO_YOUR_OLLAMA_NETWORK
